name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (.NET 10)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore Windows app
        run: dotnet restore windows/ClipSync.Windows/ClipSync.Windows.csproj

      - name: Build Windows app (Release)
        run: dotnet build windows/ClipSync.Windows/ClipSync.Windows.csproj --configuration Release --no-restore

      - name: Run Windows tests when test projects exist
        shell: pwsh
        run: |
          $testProjects = @(Get-ChildItem windows -Recurse -Filter '*.csproj' | Where-Object {
            $text = Get-Content -LiteralPath $_.FullName -Raw
            $_.Name -match '(?i)test' -or
              $text -match '<IsTestProject>\s*true\s*</IsTestProject>' -or
              $text -match '(Microsoft\.NET\.Test\.Sdk|xunit|NUnit|MSTest)'
          })
          if ($testProjects.Count -eq 0) {
            Write-Host 'No standalone Windows test projects were found; skipping Windows tests.'
            exit 0
          }
          foreach ($project in $testProjects) {
            dotnet test $project.FullName --configuration Release
            if ($LASTEXITCODE -ne 0) { throw "Tests failed for $($project.Name)." }
          }

  android:
    name: Android (debug assemble)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Ensure Android SDK 34 is installed
        run: |
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          sdkmanager_path="$(command -v sdkmanager || true)"
          if [ -z "$sdkmanager_path" ]; then
            sdkmanager_path="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager -perm -u+x | sort -V | tail -n 1)"
          fi
          if [ -z "$sdkmanager_path" ]; then
            echo 'Android sdkmanager was not found on the Ubuntu runner.' >&2
            exit 1
          fi
          yes | "$sdkmanager_path" --licenses
          "$sdkmanager_path" --install 'platforms;android-34' 'build-tools;34.0.0'

      # This repository includes gradlew.bat and the wrapper JAR, but no Unix gradlew shell script.
      # Invoke the checked-in Gradle wrapper JAR directly; this still uses gradle-wrapper.properties.
      - name: Assemble Android debug APK
        working-directory: android
        run: java -classpath gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain assembleDebug
